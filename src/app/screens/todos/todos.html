<div class="flex flex-col gap-6">
  <app-title main="Lista de Tarefas"></app-title>
  <div class="flex flex-col gap-2">
    @for(item of todos.items(); track item.id){
    <div class="p-4 border border-zinc-800 rounded-lg flex items-center gap-4">
      <span class="flex-1" [class.line-through]="item.completed">{{ item.title }}</span>
      <span
        class="px-4 py-1 rounded-full text-sm"
        [class.bg-green-700]="item.completed"
        [class.bg-yellow-700]="!item.completed"
      >
        {{ item.completed ? 'Concluído' : 'Pendente' }}
      </span>
      <div>
        <button (click)="todos.toogle(item.id)" class="btn btn-secondary mr-2">
          {{ item.completed ? 'Marcar como pendente' : 'Marcar como concluído' }}
        </button>
      </div>
    </div>
    }
  </div>
</div>
